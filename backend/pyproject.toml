[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homies-backend"
version = "0.1.0"
description = "Homies rental platform — modular monolith backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "PyJWT>=2.8",
    "email-validator>=2.1",
    "stripe>=9.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    # Pinned: an unpinned linter makes CI non-reproducible — ruff 0.16 enabled
    # ~190 new default rules and broke a green build with zero code changes.
    # Adopting a newer ruleset is a deliberate, separate cleanup cycle.
    "ruff==0.15.22",
    # Pinned for the same reason: a new mypy release ships new inference and
    # would fail a green build with no code change (D-26).
    "mypy==2.3.0",
]

# Only the application package is distributable. alembic/, scripts/ and tests/
# are repo tooling, not importable modules — without this, setuptools flat-layout
# auto-discovery sees several top-level dirs and refuses to build.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CI-04 / audit M9. Default strictness, applied to the application package only.
# It is a real blocking gate — it already caught a production hole in
# ensure_schema() (an empty migration directory verified as "at head").
# Raising strictness (disallow_untyped_defs, check_untyped_defs) and extending
# the gate to tests/ are separate cleanup cycles, not a silent widening here.
[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true   # stripe/alembic/prometheus ship no complete stubs
warn_redundant_casts = true
warn_unused_ignores = true
