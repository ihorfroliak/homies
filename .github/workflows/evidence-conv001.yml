# EVIDENCE-ONLY harness for CONV-001 (§23 exact-SHA evidence). It never tests
# its own tree: it checks out the frozen CONV candidate SOURCE_SHA explicitly,
# proves the checkout and the merge parents, and reports counts as annotations
# (raw logs need sign-in). This branch is never merged into main or CONV-001.
name: evidence-CONV-001

on:
  push:
    branches: ["evidence/CONV-001-*"]
  workflow_dispatch:

env:
  SOURCE_SHA: "5abfd7bc6f6b5aa085c8e439ba8fe67c458d1f98"
  PARENT_PRODUCT: "7ffb4f51dd315363362df1a5f8fc5c19a57767dc"
  PARENT_INFRA: "5cad442f07264ab25b3024c96fc691ad9c7a75fa"

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: homies
          POSTGRES_PASSWORD: homies
          POSTGRES_DB: homies_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homies -d homies_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the candidate (not this harness)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 2
      - name: Check out the harness (sentinel script only)
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 1
      - name: Prove the checked-out revision and its merge parents
        run: |
          got=$(git -C source rev-parse HEAD)
          parents=$(git -C source show --no-patch --format=%P HEAD)
          echo "SOURCE_SHA=$SOURCE_SHA HARNESS_SHA=$GITHUB_SHA checked_out=$got parents=$parents"
          test "$got" = "$SOURCE_SHA"
          test "$parents" = "$PARENT_PRODUCT $PARENT_INFRA"
          echo "::notice title=provenance::SOURCE_SHA=$SOURCE_SHA HARNESS_SHA=$GITHUB_SHA checked_out=$got parents=$parents run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend at the pinned set
        working-directory: source/backend
        run: |
          python -m pip install -c constraints.txt ".[dev]"
          grep -vE '^\s*(#|$)' constraints.txt | sort -f > /tmp/pinned.txt
          pip freeze --exclude-editable | grep -viE '^homies-backend([ =@]|$)' | sort -f > /tmp/installed.txt
          diff -u /tmp/pinned.txt /tmp/installed.txt
          echo "::notice title=deps::constraints.txt sha256 $(sha256sum constraints.txt | cut -c1-64); installed == pinned ($(wc -l < /tmp/installed.txt) packages)"
      - name: Environment and clock
        env:
          PGPASSWORD: homies
        run: |
          sudo apt-get -qq install -y postgresql-client >/dev/null 2>&1 || true
          pg=$(psql -h localhost -U homies -d homies_ci -Atc "select version()")
          gis=$(psql -h localhost -U homies -d homies_ci -Atc "create extension if not exists postgis; select postgis_full_version()" | tail -1)
          echo "::notice title=env::$(python --version) | ${pg%% on *} | ${gis:0:40} | runner=$ImageOS/$ImageVersion | clock=$(date -u +%FT%TZ) | ntp=$(timedatectl show -p NTPSynchronized --value 2>/dev/null)"
      - name: Alembic single head, lint, typecheck
        working-directory: source/backend
        run: |
          heads=$(python -m alembic heads)
          echo "::notice title=alembic-heads::$heads"
          test "$(echo "$heads" | grep -c '(head)')" -eq 1
          echo "$heads" | grep -q '^f3b5d7e9a1c2 (head)'
          ruff check app tests alembic scripts
          python -m mypy
      - name: Migrate base -> head on PostgreSQL/PostGIS
        working-directory: source/backend
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
        run: python -m alembic upgrade head
      - name: Full SQLite suite
        if: always()
        working-directory: source/backend
        run: |
          rc=0
          python -m pytest -q -rsfE -p no:cacheprovider --junitxml=../../sqlite.xml > ../../sqlite.log 2>&1 || rc=$?
          tail -3 ../../sqlite.log
          echo "::notice title=sqlite::$(tail -1 ../../sqlite.log)"
          grep -E '^(FAILED|ERROR) ' ../../sqlite.log | head -20 | while read -r l; do echo "::error title=sqlite-failure::${l:0:900}"; done
          exit $rc
      - name: Full PostgreSQL/PostGIS suite (restore drills required)
        if: always()
        working-directory: source/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
          HOMIES_REQUIRE_RESTORE_DRILL: "1"
        run: |
          rc=0
          python -m pytest -q -rsfE -p no:cacheprovider --junitxml=../../pg.xml > ../../pg.log 2>&1 || rc=$?
          tail -3 ../../pg.log
          echo "::notice title=postgres::$(tail -1 ../../pg.log)"
          echo "::notice title=postgres-skips::$(grep -c '^SKIPPED' ../../pg.log) skip lines: $(grep '^SKIPPED' ../../pg.log | cut -c1-150 | tr '\n' ';' | cut -c1-900)"
          echo "::notice title=drills::$(grep -cE 'test_dr_restore' ../../pg.xml) drill testcases in junit; skipped drills: $(grep -E '^SKIPPED.*dr_restore' ../../pg.log | wc -l)"
          grep -E '^(FAILED|ERROR) ' ../../pg.log | head -20 | while read -r l; do echo "::error title=pg-failure::${l:0:900}"; done
          exit $rc
      - name: Product mutation suite (committed TASK-014R runner)
        if: always()
        working-directory: source/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
          MUTATION_OUT: ../../task014r-mutation.json
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          rc=0
          python scripts/mutation/task014r_mutants.py > ../../mutation.log 2>&1 || rc=$?
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "::notice title=product-mutation::$(cut -d'|' -f1 ../../mutation.log | paste -sd' ' | cut -c1-900)"
          test $rc = 0
          python -c "import json,sys; r=json.load(open('../../task014r-mutation.json')); sys.exit(len(r) != 16 or any(m['verdict'] != 'killed' for m in r))"
      - name: Integration sentinels (product + infra, on a private copy)
        if: always()
        env:
          TEST_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
          PYTHONPATH: /tmp/w/backend
        run: |
          sudo ln -sfn "$GITHUB_WORKSPACE/source" /repo
          sudo mkdir -p /out && sudo chmod 777 /out
          rc=0
          python harness/evidence/conv_sentinels.py > sentinels.log 2>&1 || rc=$?
          cat sentinels.log
          echo "::notice title=sentinels::$(cut -d'|' -f1 sentinels.log | paste -sd' ' | cut -c1-900)"
          test $rc = 0
          cp /out/conv-sentinels.json .
          python -c "import json,sys; sys.exit(any(m['result'] != 'KILLED' for m in json.load(open('conv-sentinels.json'))))"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conv001-evidence
          path: |
            *.log
            *.xml
            *.json
