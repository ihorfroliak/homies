name: CI

on:
  push:
    # PR-001: task branches are pushed for audit without a PR; before this,
    # CI never ran on them, so no Phase-1A commit had a CI record.
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# A newer push to a task branch supersedes an older run of it. On `main` every
# commit keeps its own run (PR-001R F10): the group is per-commit there, so a
# later merge can neither cancel nor replace a queued run of an earlier one.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # CI-03: a real Postgres service so migration/concurrency/DB-guard tests run
    # against the actual engine instead of skipping. Same major version (16) as
    # the app. PostGIS since Schema v1 C5: listings carry a geography column
    # and the map search runs on it, so the engine the tests use must have it.
    # Pinned by digest so the image cannot change under a green build.
    # GitHub waits on the health check before steps run.
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: homies
          POSTGRES_PASSWORD: homies
          POSTGRES_DB: homies_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homies -d homies_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the Postgres migration + concurrency suites (else they skip).
      TEST_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
      # PR-001R F7: the backup/restore drills are part of this contract. Missing
      # client tools fail the run instead of skipping the drills silently.
      HOMIES_REQUIRE_RESTORE_DRILL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install backend
        working-directory: backend
        # Quoted: unquoted .[dev] is a shell glob, not an extras spec.
        # -c constraints.txt (PR-001): the exact dependency set verified on
        # Python 3.12, so a new upstream release cannot turn a build red/green
        # with no change here.
        run: pip install -c constraints.txt ".[dev]"
      - name: Installed set is exactly the pinned set (PR-001R F2)
        working-directory: backend
        # What CI tests and audits must be what the images ship: every package
        # in the environment at exactly its constraints.txt version. The
        # project itself is excluded (installed from the checkout).
        run: |
          grep -vE '^\s*(#|$)' constraints.txt | sort -f > /tmp/pinned.txt
          pip freeze --exclude-editable | grep -viE '^homies-backend([ =@]|$)' | sort -f > /tmp/installed.txt
          diff -u /tmp/pinned.txt /tmp/installed.txt
      - name: Runtime versions (evidence)
        working-directory: backend
        run: |
          python -VV
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          command -v pg_dump || sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version
          pg_restore --version
          pip freeze | grep -iE '^(fastapi|sqlalchemy|alembic|psycopg|pydantic|pytest)=='
      - name: Alembic has exactly one head
        working-directory: backend
        run: |
          heads=$(python -m alembic heads | grep -c "(head)")
          echo "heads=$heads"; test "$heads" -eq 1
      - name: Lint
        working-directory: backend
        run: ruff check app tests alembic scripts
      - name: Typecheck
        working-directory: backend
        # Blocking gate (audit M9). Config in pyproject.toml [tool.mypy].
        run: python -m mypy
      - name: Migrate (verify Alembic base -> head on real Postgres)
        working-directory: backend
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ["ALEMBIC_DATABASE_URL"])
          with e.connect() as c:
              print(c.scalar(text("select version()")))
              print("postgis", c.scalar(text("select postgis_lib_version()")))
              assert c.scalar(text("select current_setting('server_version_num')::int")) // 10000 == 16
          PY
      - name: Test
        working-directory: backend
        # Fast SQLite unit suite + gated Postgres migration/concurrency suites
        # (TEST_DATABASE_URL is set, so they run against the service).
        # -rs lists every skip with its reason, so "the drills ran" is visible
        # in the log rather than inferred from a count (PR-001R F7).
        run: python -m coverage run -m pytest -q -rs
      - name: Coverage threshold
        working-directory: backend
        # Fails under 80% branch coverage. Config in pyproject [tool.coverage].
        run: python -m coverage report
      - name: Dependency audit (the shipped, pinned set)
        working-directory: backend
        # PR-001R F2: `pip-audit .` resolved pyproject's ranges afresh and could
        # audit newer versions than the ones pinned and shipped. This audits
        # exactly constraints.txt: every pin as written, no resolution
        # (--no-deps --disable-pip), and not the runner's own toolchain (the
        # D-26 lesson). The step above proves the environment equals the pins.
        run: python -m pip_audit -r constraints.txt --no-deps --disable-pip --progress-spinner off
      - name: Dependency audit inspects the pins it is given (canary)
        working-directory: backend
        # A deliberately old, vulnerable pin that is never installed. The step
        # passes only when pip-audit's JSON report lists urllib3==1.26.4 with a
        # PYSEC/GHSA/CVE advisory — an advisory-lookup failure (network, PyPI,
        # OSV) is a failure, not a detection (PR-001R2, PR-001RA RA-2).
        run: python scripts/ci/audit_canary.py ../ops/ci/pip-audit-canary.pins

  # M9b: the image was never built in CI. Every deploy artifact was unverified,
  # and TD-01 made this load-bearing — the image must carry alembic/ or
  # ensure_schema() refuses to start (D-35). A Dockerfile typo would have been
  # found at deploy time, on a green build.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t homies-backend:ci backend
      - name: Image runs the supported runtime (PR-001R F8)
        # The authoritative tested runtime is Python 3.12. A base-image bump to
        # another minor (Dependabot proposed 3.14) must fail here, not ship.
        run: |
          docker run --rm homies-backend:ci python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
      - name: Image is production-like by default (PR-001R F3)
        run: |
          test "$(docker run --rm homies-backend:ci printenv ENV)" = "production"
      - name: Verify the image carries migrations (TD-01 / D-35)
        # Not a smoke test of the app — a check that the artifact contains what
        # startup requires. Without alembic/ the container starts and then
        # refuses to serve, which is a deploy-time failure, not a build one.
        run: |
          docker run --rm homies-backend:ci \
            python -c "import pathlib,sys; p=pathlib.Path('/srv/alembic/versions'); rev=sorted(p.glob('*.py')) if p.is_dir() else []; print(f'migrations in image: {len(rev)}'); sys.exit(0 if rev else 1)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip
      - name: Scan for committed secrets (gitleaks)
        # Pinned image, run directly rather than via gitleaks-action: the action
        # gates organization use behind a licence key, and this needs to keep
        # working if the repo ever moves under an org.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --no-banner --verbose

  monitoring:
    # OBS-06. An alert rule is code: the usual failure is a typo in a metric
    # name that nobody notices until the outage the rule was written for. This
    # job proves the config parses and that every alert fires on the condition
    # it claims — and stays silent on the ones it must ignore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/ops/monitoring:/work" -w /work \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check config prometheus.yml --syntax-only
          docker run --rm -v "$PWD/ops/monitoring:/work" -w /work \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check rules rules/homies.rules.yml
      - name: Unit-test the alert rules
        run: |
          docker run --rm -v "$PWD/ops/monitoring:/work" -w /work/rules \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            test rules homies.rules.test.yml
      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/ops/monitoring:/work" -w /work \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config alertmanager.yml

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BASELINE-001: the validators come from a committed, exactly pinned
      # toolchain (ops/contracts/package.json + package-lock.json), installed
      # with `npm ci`. `npx --yes <package>` resolved a floating npm graph on
      # every run, so an unrelated upstream publish could fail (or change) the
      # contract check with no change here. @asyncapi/cli 6 requires Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ops/contracts/package-lock.json
      - name: Install contract validation toolchain (pinned)
        working-directory: ops/contracts
        run: npm ci --no-audit --no-fund
      - name: Lint OpenAPI contract (Spectral)
        working-directory: ops/contracts
        run: npm run lint:openapi
      - name: Validate AsyncAPI catalog
        working-directory: ops/contracts
        run: npm run validate:asyncapi
