name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # CI-03: a real Postgres service so migration/concurrency/DB-guard tests run
    # against the actual engine instead of skipping. Same major version (16) as
    # the app; plain postgres image (btree_gist is contrib, PostGIS not needed
    # by the schema). GitHub waits on the health check before steps run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homies
          POSTGRES_PASSWORD: homies
          POSTGRES_DB: homies_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homies -d homies_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the Postgres migration + concurrency suites (else they skip).
      TEST_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        # Quoted: unquoted .[dev] is a shell glob, not an extras spec.
        run: pip install ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests alembic scripts
      - name: Typecheck
        working-directory: backend
        # Blocking gate (audit M9). Config in pyproject.toml [tool.mypy].
        run: python -m mypy
      - name: Migrate (verify Alembic base -> head on real Postgres)
        working-directory: backend
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://homies:homies@localhost:5432/homies_ci
        run: python -m alembic upgrade head
      - name: Test
        working-directory: backend
        # Fast SQLite unit suite + gated Postgres migration/concurrency suites
        # (TEST_DATABASE_URL is set, so they run against the service).
        run: python -m coverage run -m pytest -q
      - name: Coverage threshold
        working-directory: backend
        # Fails under 80% branch coverage. Config in pyproject [tool.coverage].
        run: python -m coverage report
      - name: Dependency audit
        working-directory: backend
        # Audits the project's *declared* dependencies, not the runner's
        # toolchain: a plain `pip-audit` also reports CVEs in pip itself, which
        # would turn a green build red with no change to this repo (the D-26
        # lesson). `pip-audit .` resolves pyproject instead.
        run: python -m pip_audit .

  # M9b: the image was never built in CI. Every deploy artifact was unverified,
  # and TD-01 made this load-bearing — the image must carry alembic/ or
  # ensure_schema() refuses to start (D-35). A Dockerfile typo would have been
  # found at deploy time, on a green build.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t homies-backend:ci backend
      - name: Verify the image carries migrations (TD-01 / D-35)
        # Not a smoke test of the app — a check that the artifact contains what
        # startup requires. Without alembic/ the container starts and then
        # refuses to serve, which is a deploy-time failure, not a build one.
        run: |
          docker run --rm homies-backend:ci \
            python -c "import pathlib,sys; p=pathlib.Path('/srv/alembic/versions'); rev=sorted(p.glob('*.py')) if p.is_dir() else []; print(f'migrations in image: {len(rev)}'); sys.exit(0 if rev else 1)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip
      - name: Scan for committed secrets (gitleaks)
        # Pinned image, run directly rather than via gitleaks-action: the action
        # gates organization use behind a licence key, and this needs to keep
        # working if the repo ever moves under an org.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --no-banner --verbose

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI contract (Spectral)
        run: npx --yes @stoplight/spectral-cli lint docs/api/openapi.json --ruleset .spectral.yaml
      - name: Validate AsyncAPI catalog
        run: npx --yes @asyncapi/cli validate docs/api/events.asyncapi.yaml
