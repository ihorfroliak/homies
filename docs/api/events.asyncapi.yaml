asyncapi: 3.0.0
info:
  title: Homies Phase-1 Domain Events
  version: 1.0.0
  description: >
    The domain events the Phase-1 application actually writes to its
    transactional outbox (`domain_events`), reconciled in GROWTH-001
    (docs/growth/EVENTS-v1.md). There is no external bus: an event is a row
    written in the same transaction as the change it records, idempotent by a
    unique dedup key. Payloads hold identifiers, closed codes and database
    instants only — never a message body, note, report text, moderator
    explanation, address, coordinate, price input or contact. Payloads only
    gain optional keys; a breaking change gets a new event name. None of
    these events is routed to a notification. The booking-era catalogue
    (UserRegistered, Booking*, Payment*, PayoutSent, Task*, ReviewSubmitted)
    is LEGACY_DORMANT and kept in events.legacy-booking.asyncapi.yaml.
defaultContentType: application/json
channels:
  listings:
    address: outbox.listings
    description: Publication and freshness of listings (properties module).
    messages:
      ListingBecamePublic:
        $ref: '#/components/messages/ListingBecamePublic'
      ListingConfirmed:
        $ref: '#/components/messages/ListingConfirmed'
      ListingReactivated:
        $ref: '#/components/messages/ListingReactivated'
      ListingReconfirmationDue:
        $ref: '#/components/messages/ListingReconfirmationDue'
      ListingAutoPausedStale:
        $ref: '#/components/messages/ListingAutoPausedStale'
      ListingStatusChanged:
        $ref: '#/components/messages/ListingStatusChanged'
  moderation:
    address: outbox.moderation
    description: Moderation decisions (trust module, TASK-015).
    messages:
      ModerationDecisionRecorded:
        $ref: '#/components/messages/ModerationDecisionRecorded'
  engagement:
    address: outbox.engagement
    description: Viewing transitions and provider lead stages (GROWTH-001 measurement facts).
    messages:
      ViewingRequested:
        $ref: '#/components/messages/ViewingRequested'
      ViewingResponded:
        $ref: '#/components/messages/ViewingResponded'
      ViewingCancelled:
        $ref: '#/components/messages/ViewingCancelled'
      ViewingOutcomeRecorded:
        $ref: '#/components/messages/ViewingOutcomeRecorded'
      ConversationStageChanged:
        $ref: '#/components/messages/ConversationStageChanged'
operations:
  recordListingEvents:
    action: send
    channel:
      $ref: '#/channels/listings'
  recordModerationEvents:
    action: send
    channel:
      $ref: '#/channels/moderation'
  recordEngagementEvents:
    action: send
    channel:
      $ref: '#/channels/engagement'
components:
  messages:
    ListingBecamePublic:
      name: ListingBecamePublic
      summary: A listing opened a new public episode (dedup ListingBecamePublic:{listing}:{generation}).
      payload:
        type: object
        additionalProperties: false
        required: [listing_id, property_id, public_generation, became_public_at]
        properties:
          listing_id: { $ref: '#/components/schemas/Id' }
          property_id: { $ref: '#/components/schemas/Id' }
          public_generation: { type: integer, minimum: 1 }
          became_public_at: { $ref: '#/components/schemas/Instant' }
    ListingConfirmed:
      name: ListingConfirmed
      summary: The owner confirmed the listing is still available.
      payload: { $ref: '#/components/schemas/FreshnessPayload' }
    ListingReactivated:
      name: ListingReactivated
      summary: A stale listing was confirmed and is public again.
      payload: { $ref: '#/components/schemas/FreshnessPayload' }
    ListingReconfirmationDue:
      name: ListingReconfirmationDue
      summary: The listing needs a reconfirmation (14 days).
      payload: { $ref: '#/components/schemas/FreshnessPayload' }
    ListingAutoPausedStale:
      name: ListingAutoPausedStale
      summary: The freshness sweep marked the listing stale (21 days).
      payload: { $ref: '#/components/schemas/FreshnessPayload' }
    ListingStatusChanged:
      name: ListingStatusChanged
      summary: Every write of a listing's status, with its reason (GROWTH-001).
      payload:
        type: object
        additionalProperties: false
        required: [listing_id, property_id, from_status, to_status, reason_code, public_generation, changed_at]
        properties:
          listing_id: { $ref: '#/components/schemas/Id' }
          property_id: { $ref: '#/components/schemas/Id' }
          from_status: { $ref: '#/components/schemas/ListingStatus' }
          to_status: { $ref: '#/components/schemas/ListingStatus' }
          reason_code:
            type: string
            enum: [PUBLISHED, RECONFIRMED, OWNER_PAUSE, MODERATION_HOLD, AUTHORITY_LOST, SPACE_ARCHIVED, STALE_SWEEP]
          public_generation: { type: integer, minimum: 0 }
          changed_at: { $ref: '#/components/schemas/Instant' }
    ModerationDecisionRecorded:
      name: ModerationDecisionRecorded
      summary: A moderation decision was recorded (TASK-015; ids and codes only).
      payload:
        type: object
        additionalProperties: false
        required: [decision_id, target_type, target_id, listing_id, action, reason_code, supersedes_decision_id, effective_from]
        properties:
          decision_id: { $ref: '#/components/schemas/Id' }
          target_type: { type: string, enum: [LISTING, MEDIA, MESSAGE, CONVERSATION] }
          target_id: { $ref: '#/components/schemas/Id' }
          listing_id: { $ref: '#/components/schemas/NullableId' }
          action:
            type: string
            enum: [NO_ACTION, CONTENT_EDIT_REQUIRED, VISIBILITY_LIMITED, CONTENT_REMOVED, FEATURE_RESTRICTED]
          reason_code: { type: string }
          supersedes_decision_id: { $ref: '#/components/schemas/NullableId' }
          effective_from: { $ref: '#/components/schemas/Instant' }
    ViewingRequested:
      name: ViewingRequested
      payload:
        type: object
        additionalProperties: false
        required: [viewing_id, listing_id, booking_mode, initial_status, starts_at, requested_at]
        properties:
          viewing_id: { $ref: '#/components/schemas/Id' }
          listing_id: { $ref: '#/components/schemas/Id' }
          booking_mode: { type: string, enum: [INSTANT_BOOKING, REQUEST_APPROVAL] }
          initial_status: { type: string, enum: [REQUESTED, CONFIRMED] }
          starts_at: { $ref: '#/components/schemas/Instant' }
          requested_at: { $ref: '#/components/schemas/Instant' }
    ViewingResponded:
      name: ViewingResponded
      payload:
        type: object
        additionalProperties: false
        required: [viewing_id, listing_id, to_status, responded_at]
        properties:
          viewing_id: { $ref: '#/components/schemas/Id' }
          listing_id: { $ref: '#/components/schemas/Id' }
          to_status: { type: string, enum: [CONFIRMED, DECLINED] }
          responded_at: { $ref: '#/components/schemas/Instant' }
    ViewingCancelled:
      name: ViewingCancelled
      payload:
        type: object
        additionalProperties: false
        required: [viewing_id, listing_id, prior_status, cancelled_by, moderation_decision_id, cancelled_at]
        properties:
          viewing_id: { $ref: '#/components/schemas/Id' }
          listing_id: { $ref: '#/components/schemas/Id' }
          prior_status: { type: string, enum: [REQUESTED, CONFIRMED] }
          cancelled_by: { type: string, enum: [REQUESTER, PROVIDER, HOMIES] }
          moderation_decision_id: { $ref: '#/components/schemas/NullableId' }
          cancelled_at: { $ref: '#/components/schemas/Instant' }
    ViewingOutcomeRecorded:
      name: ViewingOutcomeRecorded
      payload:
        type: object
        additionalProperties: false
        required: [viewing_id, listing_id, outcome, starts_at, recorded_at]
        properties:
          viewing_id: { $ref: '#/components/schemas/Id' }
          listing_id: { $ref: '#/components/schemas/Id' }
          outcome: { type: string, enum: [COMPLETED, NO_SHOW] }
          starts_at: { $ref: '#/components/schemas/Instant' }
          recorded_at: { $ref: '#/components/schemas/Instant' }
    ConversationStageChanged:
      name: ConversationStageChanged
      payload:
        type: object
        additionalProperties: false
        required: [conversation_id, listing_id, from_stage, to_stage, changed_at]
        properties:
          conversation_id: { $ref: '#/components/schemas/Id' }
          listing_id: { $ref: '#/components/schemas/NullableId' }
          from_stage: { $ref: '#/components/schemas/NullableStage' }
          to_stage: { $ref: '#/components/schemas/NullableStage' }
          changed_at: { $ref: '#/components/schemas/Instant' }
  schemas:
    Id:
      type: string
      maxLength: 36
    NullableId:
      type: [string, 'null']
      maxLength: 36
    Instant:
      type: string
      description: Database instant, UTC, microseconds, `YYYY-MM-DDTHH:MM:SS.ffffffZ`.
    ListingStatus:
      type: string
      enum: [draft, active, paused, stale, archived]
    NullableStage:
      type: [string, 'null']
      enum: [NEW, REPLIED, VIEWING, APPLICATION, SHORTLISTED, ACCEPTED, REJECTED, ARCHIVED, null]
    FreshnessPayload:
      type: object
      additionalProperties: false
      required: [listing_id, property_id, last_confirmed_available_at, confirmation_valid_days, auto_pause_after_days]
      properties:
        listing_id: { $ref: '#/components/schemas/Id' }
        property_id: { $ref: '#/components/schemas/Id' }
        last_confirmed_available_at:
          type: [string, 'null']
        confirmation_valid_days: { type: integer }
        auto_pause_after_days: { type: integer }
