name: homies

services:
  api:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://homies:homies@db:5432/homies
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: dev-master-key
      NATS_URL: nats://nats:4222
      ENV: local
    # OBS-01: probes the readiness endpoint, not liveness — this is what
    # "is the API actually able to serve?" means, and it is the check other
    # services would wait on. Uses python (already in the image) rather than
    # curl, which python:3.12-slim does not ship.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen("http://localhost:8000/readyz", timeout=3).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      nats:
        condition: service_started

  # OBS-06: the collector. Without this the application published metrics into
  # nothing. Rules are mounted read-only and are the same files CI tests.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    depends_on:
      api:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # Local destination so the routing tree is exercised end to end. NOT a real
  # alert channel — see ops/monitoring/alertmanager.yml.
  alert-sink:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=alert received"]

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: homies
      POSTGRES_PASSWORD: homies
      POSTGRES_DB: homies
    ports:
      # 5433 on the host: 5432 is occupied by a legacy container on this machine
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homies -d homies"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  # Local stand-in for the event bus (Kafka/MSK in prod) — see ADR-0004.
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"

volumes:
  pgdata:
  meilidata:
  promdata:
